---
- name: Upgrade the primary node of a GHES HA pair
  hosts: ghes_primary
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exactly one targeted HA primary
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in groups['ghes_primary']
        fail_msg: >-
          Target exactly one host from ghes_primary by using --limit.

    - name: Prevent accidental replica targeting
      ansible.builtin.assert:
        that:
          - inventory_hostname not in (groups['ghes_replicas'] | default([]))
        fail_msg: >-
          Replica hosts cannot be targeted by this playbook.

  roles:
    - role: ghes_upgrade
      vars:
        ghes_upgrade_topology: ha_primary
        ghes_upgrade_validate_replication: true
