---
- name: Reload GitHub Enterprise Server core services
  hosts: ghes
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  vars:
    ghes_service_restart_confirm: false
    ghes_service_maintenance_message: "GHES core services are being reloaded."
    ghes_service_leave_maintenance_on_failure: true

  pre_tasks:
    - name: Require one explicitly targeted appliance
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ghes_service_restart_confirm | bool
        fail_msg: >-
          Target one appliance with --limit and set
          ghes_service_restart_confirm=true.

  tasks:
    - name: Capture service status before reload
      ansible.builtin.command: ghe-service-list
      register: services_before
      changed_when: false

    - name: Reload core services inside maintenance mode
      block:
        - name: Enable maintenance mode
          ansible.builtin.command:
            argv:
              - ghe-maintenance
              - -s
              - "{{ ghes_service_maintenance_message }}"
          changed_when: true

        - name: Apply configuration and reload services
          ansible.builtin.command: ghe-config-apply -f
          changed_when: true

        - name: Validate GHES configuration
          ansible.builtin.command: ghe-config-check --error-checks-only
          changed_when: false

        - name: Capture service status after reload
          ansible.builtin.command: ghe-service-list
          register: services_after
          changed_when: false

        - name: Disable maintenance mode
          ansible.builtin.command: ghe-maintenance -u
          changed_when: true

      rescue:
        - name: Disable maintenance mode after failure when requested
          ansible.builtin.command: ghe-maintenance -u
          changed_when: true
          failed_when: false
          when: not (ghes_service_leave_maintenance_on_failure | bool)

        - name: Stop after failed core-service reload
          ansible.builtin.fail:
            msg: >-
              Core-service reload failed. Maintenance mode remains enabled={{
              ghes_service_leave_maintenance_on_failure }}.
