---
ansible_user: admin
ansible_port: 122
ansible_connection: ssh
ansible_ssh_private_key_file: "{{ lookup('env', 'GHES_SSH_KEY') | default('~/.ssh/ghes_ansible', true) }}"

# Controller-side evidence and package locations.
ghes_upgrade_artifact_dir: "{{ playbook_dir }}/../artifacts/staging"
ghes_upgrade_package_local_path: "{{ lookup('env', 'GHES_UPGRADE_PACKAGE') | default('', true) }}"
ghes_upgrade_package_remote_path: /home/admin/ghes-upgrade.pkg

ghes_upgrade_validate_certs: true
ghes_upgrade_manage_maintenance: true
ghes_upgrade_leave_maintenance_on_failure: true
